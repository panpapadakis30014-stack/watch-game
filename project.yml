name: Ringward
options:
  bundleIdPrefix: com.panos30013
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
packages:
  GameCore:
    path: GameCore
targets:
  # iOS container. Only a delivery vehicle for the watch app; never needs opening.
  Ringward:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Ringward, Shared]
    info:
      path: Support/Ringward-Info.plist
      properties:
        CFBundleDisplayName: Ringward
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.panos30013.ringward
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: RingwardWatch # XcodeGen puts this in "Embed Watch Content" -> $(CONTENTS_FOLDER_PATH)/Watch
    scheme: {}
  # Single-target watchOS 10 app (no WatchKit extension).
  RingwardWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources: [RingwardWatch, Shared]
    info:
      path: Support/RingwardWatch-Info.plist
      properties:
        CFBundleDisplayName: Ringward
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.panos30013.ringward
        WKRunsIndependentlyOfCompanionApp: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.panos30013.ringward.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: GameCore
      - package: GameCore
        product: HordeCore
    scheme: {}
