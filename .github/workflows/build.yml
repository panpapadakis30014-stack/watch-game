name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # macos-15 + Xcode 16.4 is the newest pairing that still ships the
    # Apple Watch SE (2nd generation) simulators (watchOS 11.5 runtime).
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      XCODEGEN_VERSION: "2.46.0"
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          xcodebuild -version
          swift --version

      - name: GameCore tests
        run: swift test --package-path GameCore

      - name: Offline and entitlements guard
        run: |
          # The workflow itself is excluded: it downloads XcodeGen.
          # Build output (.build/, from the swift test step) is excluded too:
          # Apple's generated plists carry a DTD http URL.
          if grep -rnE 'URLSession|import Network|NSAppTransport|http' \
              --include='*.swift' --include='*.yml' --include='*.plist' \
              --exclude-dir=.build --exclude-dir=build \
              GameCore Ringward RingwardWatch project.yml; then
            echo "::error::Networking found in app code"
            exit 1
          fi
          ENTITLEMENTS="$(find . -name '*.entitlements' -not -path './build/*' -not -path '*/.build/*')"
          if [ -n "$ENTITLEMENTS" ]; then
            echo "::error::Unexpected entitlements files: $ENTITLEMENTS"
            exit 1
          fi
          # Game logic: GameCore imports nothing, HordeCore only GameCore, and
          # all randomness comes from the seeded SplitMix64.
          if grep -rn '^import' GameCore/Sources/GameCore; then echo "::error::GameCore must not import anything"; exit 1; fi
          BAD="$(grep -rn '^import' GameCore/Sources/HordeCore | grep -v ':import GameCore$' || true)"
          [ -z "$BAD" ] || { echo "::error::HordeCore may only import GameCore: $BAD"; exit 1; }
          if grep -rnE 'SystemRandomNumberGenerator|\.random\(' GameCore/Sources; then echo "::error::Game logic must use SplitMix64"; exit 1; fi
          # Visuals: FXCore only imports GameCore; no blur/shadow/filters (frame
          # budget); raw colours only in Theme.swift; WCAG contrast of Theme colours.
          BAD="$(grep -rn '^import' GameCore/Sources/FXCore | grep -v ':import GameCore$' || true)"
          [ -z "$BAD" ] || { echo "::error::FXCore may only import GameCore: $BAD"; exit 1; }
          if grep -rnE '\.blur\(|\.shadow\(|addFilter|drawingGroup' RingwardWatch; then echo "::error::No blur, shadow or filter effects (frame budget)"; exit 1; fi
          if grep -rn 'Color(red' RingwardWatch | grep -v '^RingwardWatch/Theme.swift:'; then echo "::error::Raw colours belong in Theme.swift"; exit 1; fi
          python3 -I scripts/contrast.py RingwardWatch/Theme.swift

      - name: Install XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xg"
          XG="$(find "$RUNNER_TEMP/xg" -type f -name xcodegen -perm -u+x | head -1)"
          if [ -z "$XG" ]; then
            echo "::error::xcodegen binary not found in the release zip"
            exit 1
          fi
          echo "XG=$XG" >> "$GITHUB_ENV"
          "$XG" --version

      - name: Generate Xcode project
        run: '"$XG" generate'

      - name: Build for iPhone (unsigned, Release)
        run: |
          xcodebuild build \
            -project Ringward.xcodeproj \
            -scheme Ringward \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Ringward-unsigned.ipa
        run: |
          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R build/device/Build/Products/Release-iphoneos/Ringward.app build/ipa/Payload/
          (cd build/ipa && zip -qry ../../Ringward-unsigned.ipa Payload)

      - name: Check the .ipa
        run: bash scripts/check-ipa.sh Ringward-unsigned.ipa

      # Uploaded before the simulator step so a simulator problem never costs the .ipa.
      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Ringward-unsigned-ipa
          path: Ringward-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Simulator screenshots (Apple Watch SE 40mm / 44mm)
        run: bash scripts/sim-screenshots.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ringward-screenshots
          path: shots/
          if-no-files-found: warn
          retention-days: 30
